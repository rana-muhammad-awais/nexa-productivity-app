name: nexa
description: "Nexora — Premium all-in-one life & work OS: tasks, notes, expenses, khata, resources. Offline-first."
publish_to: "none"
version: 3.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (plan §5 recommends Riverpod)
  flutter_riverpod: ^2.5.1

  # Offline-first persistence (JSON blob via shared_preferences)
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Charts (replaces Chart.js) — plan §5
  fl_chart: ^0.68.0

  # Markdown rendering for notes
  flutter_markdown: ^0.7.2

  # Icons — same set as the web app (plan §4.1)
  lucide_icons: ^0.257.0

  # Typography (Inter) + i18n formatting — plan §4.1
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Utilities
  uuid: ^4.4.0
  collection: ^1.18.0

  # Glassmorphism: frosted blur + translucent surfaces
  glassmorphism: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # Locally-feasible plan features: reminders + biometric lock + export
  flutter_local_notifications: ^17.2.2
  local_auth: ^2.2.0
  share_plus: ^9.0.0

  # Timezone-aware scheduled notifications
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Runtime permission request (Android 13+)
  permission_handler: ^11.3.1

  # Launch phone/email/URL from contacts
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
